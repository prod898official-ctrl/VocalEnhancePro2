name: Build VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/VocalEnhancePro_artefacts/Release/VST3/VocalEnhancePro.vst3" dist/
          Compress-Archive -Path dist/VocalEnhancePro.vst3 -DestinationPath VocalEnhancePro-Windows-VST3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalEnhancePro-Windows-VST3
          path: VocalEnhancePro-Windows-VST3.zip
